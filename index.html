<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla UI Gags</title>
<meta name="description" content="Fan-made, browser-only demo of themed car-screen modes. Not affiliated with Tesla.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Ultra&family=Monoton&family=Mountains+of+Christmas:wght@700&family=Righteous&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <!-- Mode background, particles, car, foreground -->
    <div id="scene" class="layer"></div>
    <canvas id="fx" class="layer"></canvas>
    <div id="car-stage">
      <div id="car-labels">
        <button class="car-label" id="lbl-frunk" style="left:20%;top:-6%">Open<br>Frunk</button>
        <div class="car-lock" id="lbl-lock" style="left:52%;top:-14%" title="Lock">
          <svg viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 9.6-2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/></svg>
        </div>
        <button class="car-label" id="lbl-trunk" style="left:80%;top:-2%">Open<br>Trunk</button>
      </div>
      <div id="car"></div>
    </div>
    <div id="scene-front" class="layer"></div>
    <div id="flash" class="layer"></div>

    <!-- Status bar -->
    <header id="statusbar">
      <div class="sb-left">
        <span class="gear">P R N D</span>
        <span class="battery"><i style="width:74%"></i></span><span id="sb-batt">74 %</span>
      </div>
      <div class="sb-center">
        <svg class="ico" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 9.6-2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/></svg>
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21a8 8 0 0 1 16 0z" fill="currentColor"/></svg>
        <span>Profile</span>
      </div>
      <div class="sb-right">
        <span id="sb-time">10:45 pm</span>
        <span id="sb-temp">48°F</span>
      </div>
    </header>

    <!-- Bottom cards -->
    <section id="cards">
      <div class="card" id="mode-card"></div>
      <div class="card" id="music-card">
        <div class="mc-art" id="mc-art"></div>
        <div class="mc-meta">
          <div class="mc-title" id="mc-title">—</div>
          <div class="mc-artist" id="mc-artist">—</div>
        </div>
        <button class="round-btn" id="mc-play" title="Play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="card" id="nav-card">
        <div class="nav-search">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2"/></svg>
          Navigate
        </div>
        <div class="nav-row">
          <span><svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z" fill="currentColor"/></svg>Home</span>
          <span><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2" fill="currentColor"/><path d="M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>Work</span>
        </div>
      </div>
    </section>

    <!-- Dock -->
    <footer id="dock">
      <button class="dock-btn" id="dk-car" title="Car">
        <svg viewBox="0 0 32 32"><path d="M5 20l2-7c.5-1.6 1.6-2.5 3.3-2.5h11.4c1.7 0 2.8.9 3.3 2.5l2 7v5h-3v-2H8v2H5z" fill="currentColor"/><circle cx="10" cy="19" r="1.6" fill="#000"/><circle cx="22" cy="19" r="1.6" fill="#000"/></svg>
      </button>
      <div class="dock-temp"><span class="chev">‹</span><b id="cabin-temp">72</b><span class="chev">›</span></div>
      <div class="dock-apps">
        <button class="dock-btn app" title="Phone"><svg viewBox="0 0 32 32"><path d="M9 4l4 1 1 6-3 2a14 14 0 0 0 8 8l2-3 6 1 1 4c0 2-2 4-4 4C14 27 5 18 5 8c0-2 2-4 4-4z" fill="#22c55e"/></svg></button>
        <button class="dock-btn app" title="Calendar"><svg viewBox="0 0 32 32"><rect x="5" y="6" width="22" height="21" rx="3" fill="#fff"/><rect x="5" y="6" width="22" height="6" rx="3" fill="#ef4444"/><text x="16" y="24" font-size="10" font-weight="700" text-anchor="middle" font-family="Inter,sans-serif" fill="#111" id="cal-day">30</text></svg></button>
        <button class="dock-btn app" id="dk-music" title="Music"><svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="6" fill="#f43f5e"/><path d="M13 21V10l9-2v11" fill="none" stroke="#fff" stroke-width="2"/><circle cx="11" cy="21" r="2.5" fill="#fff"/><circle cx="20" cy="19" r="2.5" fill="#fff"/></svg></button>
        <button class="dock-btn app" id="dk-toybox" title="Toybox"><svg viewBox="0 0 32 32"><rect x="4" y="9" width="24" height="18" rx="4" fill="#f59e0b"/><rect x="8" y="5" width="9" height="8" rx="2" fill="#3b82f6"/><circle cx="21" cy="8" r="4" fill="#ec4899"/><rect x="4" y="15" width="24" height="3" fill="#b45309"/></svg></button>
        <button class="dock-btn app" id="dk-full" title="Fullscreen"><svg viewBox="0 0 32 32"><path d="M6 12V6h6M20 6h6v6M26 20v6h-6M12 26H6v-6" fill="none" stroke="currentColor" stroke-width="2.5"/></svg></button>
      </div>
      <button class="dock-btn" id="dk-vol" title="Sound">
        <svg viewBox="0 0 32 32"><path d="M5 12h5l7-6v20l-7-6H5z" fill="currentColor"/><path class="vol-waves" d="M21 11a7 7 0 0 1 0 10M24 8a11 11 0 0 1 0 16" fill="none" stroke="currentColor" stroke-width="2"/><path class="vol-x" d="M21 12l8 8M29 12l-8 8" stroke="currentColor" stroke-width="2.5"/></svg>
      </button>
    </footer>

    <!-- Toybox -->
    <div id="toybox" hidden>
      <div class="tb-panel">
        <div class="tb-head">
          <h2>Toybox</h2>
          <button class="tb-close" id="tb-close" aria-label="Close">×</button>
        </div>
        <div class="tb-grid" id="tb-grid"></div>
        <div class="tb-foot">
          <label class="switch-row"><span><b>Lite effects</b><small>Fewer particles and animations, for older (Intel Atom) screens</small></span><input type="checkbox" id="opt-lite"><i class="switch"></i></label>
          <p class="disclaimer">Fan-made browser demo. It does not change your car's real interface. Not affiliated with Tesla.</p>
        </div>
      </div>
    </div>

    <!-- Splash -->
    <div id="splash" hidden></div>
    <div id="toast"></div>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/car.js"></script>
<script src="js/app.js"></script>
<script src="js/modes/standard.js"></script>
<script src="js/modes/halloween.js"></script>
<script src="js/modes/neon.js"></script>
<script src="js/modes/frost.js"></script>
<script src="js/modes/abyss.js"></script>
<script>TeslaUI.boot();</script>
</body>
</html>
